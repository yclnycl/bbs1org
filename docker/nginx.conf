# bbs1org 容器内 nginx：本地开发与线上生产使用同一份文件。
# 改完这里要重建容器才会生效（bind mount 按 inode 挂载，覆盖文件不会自动重读）：
#   docker compose up -d --force-recreate nginx
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 128m;

    # 数据、缓存、插件、PHP 类库、Twig 模板一律不允许通过 HTTP 读取
    location ~ ^/app/(?:data|cache|plugins|optional)(?:/|$) {
        deny all;
    }
    location ~ ^/(?:vendor|templates|docs)(?:/|$) {
        deny all;
    }
    location ~ ^/(?:composer\.(?:json|lock)|README\.md)$ {
        deny all;
    }

    # app/ 下的 PHP 文件不允许直接执行（app/version.php 之类）
    location ~ ^/app/.*\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /app/avatars/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # 前端资源，包含 app/assets/vendor/ 下自托管的第三方库（EasyMDE 等）。
    # 缓存 1 小时而不是 1 年：页面里的 ?v= 只在 app/version.php 变更时才变，
    # 万一忘记改版本号，1 小时的自愈窗口远好过用户长期拿到旧 JS。
    location ~ ^/app/assets/.+\.(?:css|js|mjs|map|svg|woff2?|ttf|eot|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location ~ ^/app/upload/.+\.attach$ {
        return 404;
    }

    location ~ ^/app/upload/.*\.(?:php|phtml|phar|cgi|pl)$ {
        return 404;
    }

    location /app/upload/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
