services:
  forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: forum:latest
    ports:
      - "${FORUM_PORT:-8080}:8080"
    environment:
      SITE_NAME: ${SITE_NAME:-FORUM}
      FORUM_NAME: ${FORUM_NAME:-默认版块}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - forum_data:/app/app/data
    restart: unless-stopped

volumes:
  forum_data:
